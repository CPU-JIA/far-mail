# ============================================================
# FAR Mail - Docker Compose
# Go API + Postfix 主链路: PostgreSQL + PgBouncer + Redis + Go API + Frontend + Postfix
# ============================================================
#
# ╔══════════════════════════════════════════════════════════════╗
# ║                          端口速查表                           ║
# ╠══════════════╦════════════╦══════════════════════════════════╣
# ║ 端口         ║ 服务        ║ 说明                             ║
# ╠══════════════╬════════════╬══════════════════════════════════╣
# ║ 8889(本机)   ║ frontend   ║ 独立控制台静态服务                ║
# ║ 18081(本机)  ║ api        ║ Go HTTP/API 主入口                ║
# ║ 25  (对外)   ║ postfix    ║ SMTP 收信入口                     ║
# ║ 2526(本机)   ║ postfix    ║ 本机压测 SMTP 入口                ║
# ║ 5432(内部)   ║ postgres   ║ PostgreSQL 数据库                 ║
# ║ 6432(内部)   ║ pgbouncer  ║ PostgreSQL 连接池                 ║
# ║ 6379(内部)   ║ redis      ║ 缓存与限流                        ║
# ╚══════════════╩════════════╩══════════════════════════════════╝
#
name: far-mail

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    pids_limit: 128
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=2MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=120"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=100"
      - "-c"
      - "min_wal_size=128MB"
      - "-c"
      - "max_wal_size=1GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 64
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 64m
    pids_limit: 64
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "96mb"
      - "--maxmemory-policy"
      - "volatile-lru"
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--aof-use-rdb-preamble"
      - "yes"
      - "--auto-aof-rewrite-percentage"
      - "100"
      - "--auto-aof-rewrite-min-size"
      - "32mb"
      - "--save"
      - ""
      - "--tcp-backlog"
      - "511"
      - "--timeout"
      - "0"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./api
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: far-mail-api-local:latest
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./data:/data
    environment:
      DB_DSN: ${API_DB_DSN}
      REDIS_ADDR: ${API_REDIS_ADDR}
      REDIS_PASSWORD: ${API_REDIS_PASSWORD}
      RATE_LIMIT: ${API_RATE_LIMIT}
      RATE_WINDOW: ${API_RATE_WINDOW}
      PORT: ${API_PORT}
      SMTP_SERVER_IP: ${SMTP_SERVER_IP}
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}
      ADMIN_KEY_FILE: /data/admin.key
      INTEGRATION_SECRETS_FILE: /data/integrations.json
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-http://localhost:8889}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      INTERNAL_SYNC_KEY: ${INTERNAL_SYNC_KEY:?Set INTERNAL_SYNC_KEY in .env}
      DISABLE_CLEANUP_LOOP: ${DISABLE_CLEANUP_LOOP:-false}
      DISABLE_DOMAIN_HEALTH_LOOP: ${DISABLE_DOMAIN_HEALTH_LOOP:-false}
      DISABLE_MX_VERIFIER_LOOP: ${DISABLE_MX_VERIFIER_LOOP:-false}
      AUTO_CLEAN_INTERVAL_SECONDS: ${AUTO_CLEAN_INTERVAL_SECONDS:-60}
      AUTO_CLEAN_EMAIL_MAX_AGE_MINUTES: ${AUTO_CLEAN_EMAIL_MAX_AGE_MINUTES:-1440}
      AUTO_CLEAN_EMAIL_MAX_COUNT: ${AUTO_CLEAN_EMAIL_MAX_COUNT:-30000}
      LMTP_ADDR: ${LMTP_ADDR:-0.0.0.0:2527}
      INGRESS_WORKERS: ${INGRESS_WORKERS:-48}
      INGRESS_QUEUE_SIZE: ${INGRESS_QUEUE_SIZE:-2048}
      INGRESS_DELIVERY_TIMEOUT_SECONDS: ${INGRESS_DELIVERY_TIMEOUT_SECONDS:-8}
      INGRESS_BODY_MAX_BYTES: ${INGRESS_BODY_MAX_BYTES:-262144}
      INGRESS_STORE_BODY_MAX_BYTES: ${INGRESS_STORE_BODY_MAX_BYTES:-65536}
      INGRESS_CACHE_REFRESH_SECONDS: ${INGRESS_CACHE_REFRESH_SECONDS:-30}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal
      - edge

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: far-mail-frontend-local:latest
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 16m
    pids_limit: 32
    ports:
      - "127.0.0.1:8889:8080"
    environment:
      # Empty means same-origin API paths behind the user's reverse proxy.
      # The local default keeps http://127.0.0.1:8889 usable without an edge proxy.
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN-http://127.0.0.1:18081}
    networks:
      - edge

  postfix:
    build:
      context: ./postfix
      dockerfile: Dockerfile
    image: far-mail-postfix-local:latest
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    ports:
      - "25:25"
      - "127.0.0.1:2526:25"
    environment:
      SMTP_HOSTNAME: ${SMTP_HOSTNAME}
      INTERNAL_SYNC_KEY: ${INTERNAL_SYNC_KEY:?Set INTERNAL_SYNC_KEY in .env}
      POSTFIX_LMTP_DESTINATION_CONCURRENCY_LIMIT: ${POSTFIX_LMTP_DESTINATION_CONCURRENCY_LIMIT:-100}
      POSTFIX_DEFAULT_DESTINATION_CONCURRENCY_LIMIT: ${POSTFIX_DEFAULT_DESTINATION_CONCURRENCY_LIMIT:-120}
      POSTFIX_LMTP_CONNECTION_CACHE_DESTINATIONS: ${POSTFIX_LMTP_CONNECTION_CACHE_DESTINATIONS:-static:all}
      POSTFIX_LMTP_CONNECTION_CACHE_TIME_LIMIT: ${POSTFIX_LMTP_CONNECTION_CACHE_TIME_LIMIT:-30s}
      POSTFIX_CONNECTION_CACHE_TTL_LIMIT: ${POSTFIX_CONNECTION_CACHE_TTL_LIMIT:-30s}
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

volumes:
  pgdata:
  redisdata:

networks:
  internal:
    driver: bridge
  edge:
    name: ${EDGE_NETWORK_NAME:-far-mail-edge}
    driver: bridge
